include:
  - path: ./CinemaBackend/dev-utils/infrastructure/postgres.yaml
  - path: ./CinemaFrontend/admin-docker/compose.yaml

services:
  init-storage:
    image: alpine:latest
    user: "0:0"
    volumes:
      - cinema_assets:/var/cinema_assets
    command: >
      sh -c "mkdir -p /var/cinema_assets && chown -R 1654:1654 /var/cinema_assets && chmod -R 775 /var/cinema_assets"

  cinemabackend.admin.api:
    image: cinemabackend.admin.api
    build:
      context: ./CinemaBackend
      dockerfile: src/Admin/CinemaBackend.Admin.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DbConnection=Host=postgres-db;Username=sa;Password=Qwe123!@#;Database=cinema_development_db
      - Host__StorageRootPath=/var/cinema_assets
      - Host__BaseUrl=http://localhost:5000
      - Jwt__AccessTokenExpirationTimeMinutes=15
      - Jwt__RefreshTokenExpirationTimeMinutes=260
    ports:
      - 5000:8080
      - 5001:8081
    volumes:
      - cinema_assets:/var/cinema_assets

    depends_on:
      postgres-db:
        condition: service_healthy
      init-storage:
        condition: service_completed_successfully
  
  
  cinemabackend.client.api:
    image: cinemabackend.client.api
    build:
      context: ./CinemaBackend
      dockerfile: src/Client/CinemaBackend.Client.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DbConnection=Host=postgres-db;Username=sa;Password=Qwe123!@#;Database=cinema_development_db
      - Host__StorageRootPath=/var/cinema_assets
      - Host__BaseUrl=http://localhost:5002
      - Jwt__AccessTokenExpirationTimeMinutes=15
      - Jwt__RefreshTokenExpirationTimeMinutes=260
    ports:
      - 5002:8080
      - 5003:8081
    volumes:
      - cinema_assets:/var/cinema_assets

    depends_on:
      postgres-db:
        condition: service_healthy
      cinemabackend.admin.api:
        condition: service_started

volumes:
  cinema_assets: