services:
  postgres-db:
    image: postgres:17-alpine
    container_name: cinema-postgres
    restart: always

    environment:
      POSTGRES_DB: cinema_development_db
      POSTGRES_PASSWORD: Qwe123!@#
      POSTGRES_USER: sa
    ports:
      - 5432:5432
    volumes:
      - cinema_database:/var/lib/postgresql/data

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

volumes:
  cinema_database:
