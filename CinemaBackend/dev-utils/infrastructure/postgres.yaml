services:
  postgres-db:
    image: postgres:17-alpine
    container_name: cinema-postgres
    restart: always

    environment:
      POSTGRES_DB: cinema_development_db
      POSTGRES_PASSWORD: Qwe123!@#
      POSTGRES_USER: sa
    ports:
      - 5432:5432
    volumes:
      - cinema_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sa -d cinema_development_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  adminer:
    image: adminer
    restart: always
    ports:
      - 5005:8080

volumes:
  cinema_database: