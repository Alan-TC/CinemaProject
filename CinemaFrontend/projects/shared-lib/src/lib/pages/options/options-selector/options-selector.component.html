<div class="options-selector">
  <div class="options-selector__header inter-black">
    <p class="options-selector__header-title">Opções</p>
  </div>
  <div class="options-selector__content inter-black">
    @for(item of optionsItems(); track $index) {
        @if(item.action) {
          <a class="options-selector__item" (click)="action.emit(item.action)" routerLinkActive="activated"> {{ item.label}} </a>
        } @else if(item.route) {
          <a class="options-selector__item" [routerLink]="item.route" routerLinkActive="activated"> {{ item.label}} </a>
        }
      }
  </div>
</div>
