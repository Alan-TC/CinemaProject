<div #meuSelector class="mutiple-selector">
  <div class="mutiple-selector__placeholder-container">
    <input
      type="text"
      [id]="inputId()"
      class="mutiple-selector__placeholder inter-black"
      readonly
      [value]="getSelectedLabels()"
      (blur)="handleBlur()">
  </div>

  <div
    class="mutiple-selector__options"
    (mousedown)="$event.preventDefault()">

    @for(option of options(); track option.id) {
      <div class="mutiple-selector__options-option">
        <input
          [id]="`option-${option.id}`"
          type="checkbox"
          [checked]="value().includes(option.id)"
          (change)="onSelectedOption(option.id)">
        <label for="{{ `option-${option.id}` }}">{{ option.label }} </label>
      </div>
    }
  </div>
</div>
