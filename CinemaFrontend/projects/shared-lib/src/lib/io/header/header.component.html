<header class="header">
  <div class="header__logo" [routerLink]="logoRedirect()" [class.redirect]="logoRedirect() !== ''"></div>
  <div class="header__center inter-black"
    [routerLink]="centerRedirect()"
    [class.redirect]="centerRedirect() !== ''">
    <p class="header__center-name">Cinema
      @if(subName()) {
        <span class="header__center-sub-name">{{ subName() }}</span>
      }
    </p>
  </div>
  <div class="header__user inter-black">
    @if(isLoggedIn()) {
      <lib-user [profileNavItems]="profileNavItems()" (action)="action.emit($event)"></lib-user>
    } @else {
      @if(loggedInAction()?.action) {
        <a class="header__login" (click)="action.emit(loggedInAction()?.action || '')"><span>Entrar</span><span>Registrar</span></a>
      } @else if(loggedInAction()?.route) {
        <a class="header__login" [routerLink]="loggedInAction()?.route"><span>Entrar</span><span>Registrar</span></a>
      }
    }
  </div>
</header>
