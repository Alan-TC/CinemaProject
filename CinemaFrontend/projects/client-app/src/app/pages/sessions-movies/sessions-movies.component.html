<div class="container" (scroll)="onScroll($event)">
  <div class="container__featured-movies">
    <cln-movie-film
      class="film"
      [class]="thirdFeaturedMovieClass()"
      (movieClicked)="movieClicked($event)"
      [movie]="movie1()"></cln-movie-film>
    <cln-movie-film
      class="film"
      [class]="firstFeaturedMovieClass()"
      (movieClicked)="movieClicked($event)"
      [movie]="movie2()"></cln-movie-film>
    <cln-movie-film
      class="film"
      [class]="secondFeaturedMovieClass()"
      (movieClicked)="movieClicked($event)"
      [movie]="movie3()"></cln-movie-film>
  </div>
  <div class="container__lists">
    <div class="list-header">
      <div class="list-header__options">
        <a class="option inter-black" routerLink="sessions" routerLinkActive="active">Sessões</a>
        <a class="option inter-black" routerLink="movies" routerLinkActive="active">Filmes</a>
      </div>
      <lib-search-input placeholder="Pesquisar filme" (search)="onSearchClick($event)"></lib-search-input>
    </div>
    <router-outlet></router-outlet>
  </div>
</div>
